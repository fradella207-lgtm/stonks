    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stonks_theme_mode');
          var isLight = saved === 'light';
          var isBlack = saved === 'black';
          var color = isLight ? '#ffffff' : (isBlack ? '#000000' : '#09090b');
          var scheme = isLight ? 'light' : 'dark';
          document.documentElement.className = (isLight ? 'light ' : 'dark ') + 'theme-' + (saved || 'dark');
          document.documentElement.style.backgroundColor = color;
          document.documentElement.style.colorScheme = scheme;
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) metaTheme.setAttribute('content', color);
          var metaScheme = document.getElementById('meta-color-scheme');
          if (metaScheme) metaScheme.setAttribute('content', scheme);
        } catch(e) {}
      })();
    </script>

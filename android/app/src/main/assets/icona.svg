<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>

    <!-- Glowing Cyan/Emerald Ribbon Gradient -->
    <linearGradient id="stonksRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#05d5b3"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="30" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Vertical Subtle Axis Line -->
  <line x1="256" y1="105" x2="256" y2="407" stroke="#1c2738" stroke-width="12" stroke-linecap="round"/>

  <!-- Neon Glowing S-Curve Group -->
  <g filter="url(#neonGlow)">
    <!-- Main S Path -->
    <path 
      d="M 160 330 C 135 345, 140 380, 180 380 C 240 380, 275 320, 256 260 C 235 195, 270 145, 345 145" 
      fill="none" 
      stroke="url(#stonksRibbon)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Upward Arrow Head -->
    <path 
      d="M 310 175 L 365 135 L 365 235" 
      fill="none" 
      stroke="url(#stonksRibbon)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
